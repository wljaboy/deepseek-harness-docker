name: 自动同步官方 DeepSeek Harness 新版本

# 触发方式:
#   1. 每天 UTC 02:00 自动检查官方 npm 包是否有新版本
#   2. 手动点击 "Run workflow" 立即检查
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查询官方 npm 包最新版本
        id: npm
        run: |
          LATEST=$(curl -s https://registry.npmmirror.com/@deepseek-ai/dsh/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "官方最新版本: ${LATEST}"

      - name: 对比当前镜像版本
        id: compare
        run: |
          PREV=$(cat .last-built-version 2>/dev/null || echo "none")
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "上次构建版本: ${PREV}"

      - name: 有新版本时构建并推送
        if: steps.compare.outputs.prev != steps.npm.outputs.latest || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.npm.outputs.latest }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/deepseek-harness-nas"
          echo "开始构建 ${VERSION} ..."
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # 下载官方 Caddy + 用官方 checksums.txt 的 SHA-512 校验（Actions 海外网络，走 GitHub Release）
          CADDY_VERSION=v2.10.2
          curl -sL -o caddy.tar.gz "https://github.com/caddyserver/caddy/releases/download/${CADDY_VERSION}/caddy_${CADDY_VERSION#v}_linux_amd64.tar.gz"
          curl -sL -o checksums.txt "https://github.com/caddyserver/caddy/releases/download/${CADDY_VERSION}/caddy_${CADDY_VERSION#v}_checksums.txt"
          EXPECTED=$(grep "caddy_${CADDY_VERSION#v}_linux_amd64.tar.gz" checksums.txt | awk '{print $1}')
          ACTUAL=$(sha512sum caddy.tar.gz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Caddy SHA-512 校验失败"
            exit 1
          fi
          echo "Caddy 官方 SHA-512 校验通过"
          tar -xzf caddy.tar.gz
          mkdir -p docker/caddy
          cp caddy docker/caddy/caddy 2>/dev/null || cp caddy_linux_amd64 docker/caddy/caddy
          chmod +x docker/caddy/caddy
          docker/caddy/caddy version
          # 用 buildx 构建并直接推送（OCI index 多架构格式，兼容 OpenWrt 等 Docker 环境）
          # SOURCE_DATE_EPOCH: 整秒时间戳；--provenance=true 生成 OCI index（含 attestation）
          docker buildx create --use --name dsh-builder 2>/dev/null || true
          SOURCE_DATE_EPOCH=$(date +%s) docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --build-arg "DSH_VERSION=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --push .
          # 记录本次构建版本
          echo "${VERSION}" > .last-built-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-built-version
          git commit -m "build: 同步官方 DSH ${VERSION}" || true
          git push || true

      - name: 无新版本
        if: steps.compare.outputs.prev == steps.npm.outputs.latest
        run: echo "官方版本无变化，跳过构建"